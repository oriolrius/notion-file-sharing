name: CI / image / release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  image:
    name: image (ghcr.io)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  cli:
    name: CLI ${{ matrix.target }} (glibc ${{ matrix.glibc }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, asset: x86_64-linux-gnu, glibc: "2.17" }
          - { target: i686-unknown-linux-gnu, asset: i686-linux-gnu, glibc: "2.17" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # zig links against an old glibc (2.17 = CentOS 7) so the binary runs on old and new distros.
      - name: Install cargo-zigbuild
        # venv first in PATH: cargo-zigbuild finds zig through `python3 -m ziglang`.
        run: |
          python3 -m venv "$RUNNER_TEMP/zb"
          "$RUNNER_TEMP/zb/bin/pip" install --quiet cargo-zigbuild==0.24.1 ziglang==0.17.1
          echo "$RUNNER_TEMP/zb/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.${{ matrix.glibc }}
      - name: Check glibc requirement
        run: |
          f=target/${{ matrix.target }}/release/nfs
          file "$f"
          max=$(objdump -T "$f" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
          echo "highest symbol version: $max"
          [ "$max" = "GLIBC_${{ matrix.glibc }}" ] || [ "$(printf '%s\n' "$max" "GLIBC_${{ matrix.glibc }}" | sort -V | tail -1)" = "GLIBC_${{ matrix.glibc }}" ]
          mkdir -p out && cp "$f" "out/nfs-${{ matrix.asset }}"
      - name: Smoke test (x86_64 only, the runner cannot exec i686 without multilib)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: out/nfs-${{ matrix.asset }} --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nfs-${{ matrix.asset }}
          path: out/nfs-${{ matrix.asset }}
          retention-days: 7

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the glibc CLI binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nfs-*-linux-gnu
          path: gnu
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Export the static binary (same build cache as the image)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: binary
          platforms: linux/amd64
          outputs: type=local,dest=dist
          provenance: false
          sbom: false
          cache-from: type=gha
      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          mv dist/nfs "dist/nfs-${v}-x86_64-linux-musl"
          for f in gnu/nfs-*; do
            install -m 755 "$f" "dist/nfs-${v}-${f#gnu/nfs-}"
          done
          chmod 755 dist/nfs-*
          (cd dist && sha256sum nfs-* > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes (docs/release-notes/<version>.md, else the CHANGELOG section)
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ -f "docs/release-notes/${v}.md" ]; then
            cp "docs/release-notes/${v}.md" notes.md
          else
            awk -v h="## ${GITHUB_REF_NAME} " 'index($0,h)==1{p=1;next} /^## /{if(p)exit} p' CHANGELOG.md > notes.md
          fi
          {
            echo
            echo "### CLI binaries"
            echo
            echo "| File | Runs on |"
            echo "|---|---|"
            echo "| \`nfs-${v}-x86_64-linux-musl\` | any x86_64 Linux (static, no libc needed) |"
            echo "| \`nfs-${v}-x86_64-linux-gnu\` | x86_64 Linux with glibc ≥ 2.17 |"
            echo "| \`nfs-${v}-i686-linux-gnu\` | 32-bit x86 Linux with glibc ≥ 2.17 |"
            echo
            echo "### Container image"
            echo
            echo '```'
            echo "${IMAGE}:${v}"
            echo "${IMAGE}@${{ needs.image.outputs.digest }}"
            echo '```'
          } >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "NFS ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
