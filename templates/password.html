{% extends "base.html" %}
{% block title %}Enllaç protegit{% endblock %}
{% block content %}
<form class="card" method="post" action="{{ action }}">
  <h2>Enllaç protegit</h2>
  <p class="lead">Escriu la contrasenya per descarregar el fitxer. · Enter the password to download the file.</p>
  {% if let Some(e) = error %}<div class="alert" role="alert">{{ e }}</div>{% endif %}
  <div class="field">
    <label for="password">Contrasenya · Password</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
  </div>
  <button class="primary" type="submit">Continua</button>
</form>
{% endblock %}
