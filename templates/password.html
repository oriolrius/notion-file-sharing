{% extends "base.html" %}
{% block title %}{{ t.pw_title }}{% endblock %}
{% block content %}
<form class="card" method="post" action="{{ action }}">
  <h2>{{ t.pw_title }}</h2>
  <p class="lead">{{ t.pw_lead }}</p>
  {% if let Some(e) = error %}<div class="alert" role="alert">{{ e }}</div>{% endif %}
  <div class="field">
    <label for="password">{{ t.password }}</label>
    <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
  </div>
  <button class="primary" type="submit">{{ t.pw_continue }}</button>
</form>
{% endblock %}
